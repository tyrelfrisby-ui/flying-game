name: Flight Tests
on:
  push:
    branches: [main]
    paths: ["src/**", "tools/**", "configs/**"]
  pull_request:
    paths: ["src/**", "tools/**", "configs/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tools/FlightTests --nologo
