; AERO RC LINK -- build configuration.
;
; One command flashes it:    cd tools/rc-link && pio run -e <your board> -t upload
; One command watches it:    pio device monitor -b 115200
;
; PlatformIO is used rather than ESP-IDF (which docs/RC-LINK-SPEC.md originally named) for one reason: `pio run`
; installs its own toolchain on first use and needs nothing else on the Mac, while ESP-IDF wants a 1.5 GB SDK, an
; export script sourced into the shell, and a `python3` that is the right one. The owner has limited hands-on time
; and said he will not debug a build process. Nothing in this firmware needs ESP-IDF directly.
;
; ---------------------------------------------------------------------------------------------------------------
; WHY THE PLATFORM VERSION IS PINNED, and pinned LOW
; ---------------------------------------------------------------------------------------------------------------
; espressif32 6.x ships Arduino-ESP32 core 2.x, whose BLE library is the Bluedroid-based one with
; BLEHIDDevice / BLEDevice::setSecurityAuth -- the API src/main.cpp is written against. Core 3.x moved BLE to
; NimBLE and changed those calls. So the pin is not caution, it is a correctness requirement for the RC_BLE build.
; If this is ever moved to a 7.x platform, the `#if RC_BLE` block is the part that needs rewriting; the default
; JoyLink build uses nothing that changed.

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = time, default
build_flags =
    -std=gnu++17
    -Wall
    ; RC_ORDER   -- the transmitter's channel order. AETR for FrSky / Futaba / Jeti / EdgeTX (the default),
    ;               TAER for Spektrum and JR, RETA for older Hitec / Multiplex. Get this wrong and the elevator
    ;               flies the throttle; it is the first thing to change if the controls land on the wrong axes.
    ;               (There is deliberately NO Mode 1 / Mode 2 flag -- see the long note in include/rc_map.h: mode
    ;               lives inside the transmitter and the channel stream is numbered by function, not by gimbal.)
    -DRC_ORDER=AETR
    ; RC_FLAP_CHANNEL -- the 2- or 3-position switch that becomes the flap lever; 0 for none.
    -DRC_FLAP_CHANNEL=5
    ;
    ; RC_JOYLINK and RC_BLE are NOT set here, and that is deliberate: src/main.cpp defaults them with #ifndef
    ; (JoyLink on, BLE off), and defining them in both places would make every board env that changes one of them
    ; emit a -Wmacro-redefined warning. A build that warns looks like a build that is broken.
    ;   RC_JOYLINK=1  Wi-Fi + Bonjour + UDP -- THE PATH THAT WORKS ON iOS. The default.
    ;   RC_BLE=1      the BLE HID gamepad. Adds ~600 kB of BLE stack, and on iOS the pad pairs and is then
    ;                 invisible to every app (README.md, "The iOS problem"). Use the -both or -ble env.
build_unflags = -std=gnu++11
lib_deps =
    ; None. On purpose: the default build pulls nothing off the internet, so it cannot fail because a library
    ; moved, and the BLE gamepad is hand-written against the core's own stack rather than a third-party one.

; ---------------------------------------------------------------------------------------------------------------
; THE BOARDS
; ---------------------------------------------------------------------------------------------------------------
; The pin numbers below are the Grove connector and the user button as the M5Stack pinouts give them. CHECK YOURS
; -- they differ between revisions, and a wrong RC_PIN is a one-line change here, not a code change. If the status
; line says "format none" with the transmitter on, this is the first suspect.
;
;   RC_PIN                  the trainer-port signal (Grove yellow or white; see README.md for the wiring)
;   RC_BUTTON_PIN           hold at power-up for access-point mode, hold 3 s while running to calibrate; -1 = none
;   RC_BUTTON_ACTIVE_LOW    1 for a button that pulls to ground, which is all of these
;   RC_LED_PIN              a plain LED, flashed when the link is not live; -1 = none. Deliberately not a WS2812
;                           or a display -- every M5 variant wires those differently, and the status that matters
;                           goes over the serial line, which they all have.

; Any classic ESP32 board (Atom Lite, M5StickC, Core2, a bare dev board). Works on all of them; the Grove pins of
; the common M5 units are the same 32/33 pair. Start here if you are not sure which board you have.
[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DRC_PIN=32 -DRC_BUTTON_PIN=-1 -DRC_LED_PIN=-1

[env:m5stack-atom]
board = m5stack-atom
build_flags = ${env.build_flags} -DRC_PIN=32 -DRC_BUTTON_PIN=39 -DRC_LED_PIN=-1

[env:m5stick-c]
board = m5stick-c
build_flags = ${env.build_flags} -DRC_PIN=32 -DRC_BUTTON_PIN=37 -DRC_LED_PIN=10

[env:m5stack-core2]
board = m5stack-core2
; Core2's three "buttons" are capacitive and not GPIOs, so there is no button here: provision over the AP form and
; calibrate with the wizard in the game instead.
build_flags = ${env.build_flags} -DRC_PIN=32 -DRC_BUTTON_PIN=-1 -DRC_LED_PIN=-1

; ESP32-S3 boards (AtomS3, AtomS3 Lite, StampS3). NOTE: the -S3 has NO Bluetooth Classic. That costs nothing here
; -- this firmware only ever uses BLE and Wi-Fi -- but it does close off the one theoretical route to a pad iOS
; would accept (impersonating a console controller over Classic HID), which is covered in README.md and rejected
; there for other reasons too.
[env:m5stack-atoms3]
board = m5stack-atoms3
build_flags = ${env.build_flags} -DRC_PIN=2 -DRC_BUTTON_PIN=41 -DRC_LED_PIN=-1

[env:m5stack-stamps3]
board = m5stack-stamps3
build_flags = ${env.build_flags} -DRC_PIN=13 -DRC_BUTTON_PIN=0 -DRC_LED_PIN=-1

; Both transports at once, on a classic ESP32: this is the env for the thirty-second test in README.md that says
; whether iOS sees a BLE HID gamepad. Wi-Fi and BLE do coexist on one radio; expect a little more latency.
[env:esp32dev-both]
board = esp32dev
build_flags = ${env.build_flags} -DRC_PIN=32 -DRC_BUTTON_PIN=-1 -DRC_LED_PIN=-1 -DRC_BLE=1

; BLE gamepad only -- for Android, Windows, a PC sim, or a desk test with no Wi-Fi around.
[env:esp32dev-ble]
board = esp32dev
build_flags = ${env.build_flags} -DRC_PIN=32 -DRC_BUTTON_PIN=-1 -DRC_LED_PIN=-1 -DRC_JOYLINK=0 -DRC_BLE=1
